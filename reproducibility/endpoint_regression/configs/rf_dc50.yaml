# DC50 Random-Forest head (fitted on the fused 512-d Transformer representation)
model: {class: RandomForestRegressor, n_estimators: 500, max_depth: 20, random_state: 42, n_jobs: -1}
input: {features: 512, source: Z_train.npy}
target: {name: DC50, transform: log10_nM, aggregation: median_per_compound}
output: rf_dc50.joblib
